name: CI (python)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-23
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-23
        with:
          python-version: '3.12'
      - name: Validate Bash installer syntax
        run: bash -n install.sh
      - name: Compile Python sources
        run: python -m compileall -q engine format tests
      - name: Verify parser, installation and removal safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
