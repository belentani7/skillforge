name: CI (python)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q engine format tests
      - name: Verify parser, installation and removal safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
