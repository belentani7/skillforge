# ═══════════════════════════════════════════════════════════════
# ⚒️ SkillForge — Default Configuration
# ═══════════════════════════════════════════════════════════════
# Override these in config/user.yaml (generated by install.sh)

# Where SkillForge is installed
install_dir: ~/.skillforge

# Auto-check for updates on install
auto_update: false

# GitHub API base URL (can be overridden for enterprise GitHub)
registry_url: https://api.github.com

# Maximum search results to display
max_results: 20

# Cache TTL for search results (seconds)
cache_ttl: 3600

# ── Tool configuration ────────────────────────────────────────
# Set to false to skip installing to a specific tool.
# Auto-detected during install.sh; edit to override.
tools:
  claude: true
  codex: true
  aider: true
  qwen: true
  gemini: true

# ── Network ───────────────────────────────────────────────────
# Timeout for API requests (seconds)
request_timeout: 15

# GitHub token for higher rate limits (optional)
# github_token: ghp_xxxxxxxxxxxxxxxxxxxx

# ── Display ───────────────────────────────────────────────────
# Show ASCII banner on CLI startup
show_banner: true

# Color output (auto, always, never)
color: auto
